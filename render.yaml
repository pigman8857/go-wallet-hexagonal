services:
  - type: web
    name: go-wallet-hex
    runtime: docker
    repo: https://github.com/pigman8857/go-wallet-hexagonal
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext:  .
    # plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: DATABASE_URL
        fromDatabase:
          name: go-wallet-db
          property: connectionString

databases:
  - name: go-wallet-db
    databaseName: walletdb
    plan: free
