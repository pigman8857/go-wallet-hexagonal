name: CI/CD 


on:
  push:
    branches: [main]     # run test job on every push to main
    tags: ["v*"]         # pushing a "v*" tag also satisfies the build job's condition below
  pull_request:
    branches: [main]     # run test job on PRs targeting main

env:
  GO_VERSION: "1.27"
  IMAGE_NAME: "hexagonal-app:latest"

jobs:
  # job 1: test
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{env.GO_VERSION}}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test (with race detector)
      ## run test one time and force no cache
        run: go test -race -count=1 ./...
  build:
    name: build & push
    needs: [test]   # only starts after test succeeds
    # Skips entirely (not a failure) unless this push is a "v*" tag —
    # e.g. `git tag v0.1.0 && git push origin v0.1.0`. Regular pushes to
    # main only run the test job above.
    if: github.event_name == 'push' && startsWith(github.ref,'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push images to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
        # need permission write packages
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}   # auto-provided by Actions, no manual secret needed

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{github.repository}}/${{env.IMAGE_NAME}}
          tags: |
            type=semver,pattern={{version}}       # e.g. v1.2.3 -> 1.2.3
            type=semver,pattern={{major}},{{major}}  # e.g. v1.2.3 -> 1
            type=sha,format=short                 # always also tag with the short commit sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          cache-from: type=gha    # reuse layer cache from previous runs
          cache-to: type=gha,mode=max


